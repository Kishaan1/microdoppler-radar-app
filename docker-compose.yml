version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: radar_pass
      POSTGRES_DB: radar_db
    volumes:
      - radar_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar_user -d radar_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://radar_user:radar_pass@db:5432/radar_db
      FLASK_ENV: production
      SECRET_KEY: change-me-in-production
      RADAR_STREAM_HZ: "10"
      PORT: "8000"
    ports:
      - "8000:8000"

volumes:
  radar_pg_data:
